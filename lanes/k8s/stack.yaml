# The benchmark stack, applied by deploy.sh in two parts (kubectl apply -l bench/part=<name>) with
# every placeholder filled in (lib.sh render):
#   setup     mockllm and s3stub
#   gateways  the Python and the Rust gateway, Bifrost and Portkey, as SIDES selects (bench/side),
#             once the database is migrated and seeded
# The <release>-genconfig ConfigMap the pods mount is created by deploy.sh from genconfig.sh.
# Postgres and Redis are in deps.yaml; migrate and seed are in jobs.yaml.
#
# Every gateway starts from the same generated config (genconfig.sh, with a fixed key seed, so every
# pod and the runner derive the identical config.yaml, keys.txt and keys.sql), gets the same CPU and
# memory (GATEWAY_CPU, GATEWAY_MEMORY_GI; 4 cores and 16Gi by default), and reads keys from the same
# database. Requests equal limits, so each gateway has its cores to itself while the others idle
# between runs. Every pod gets NODE_SELECTOR and TOLERATION when they are set.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __RELEASE__-mockllm
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/instance: __RELEASE__
    app.kubernetes.io/name: ai-gateway-bench
    bench/part: setup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: __RELEASE__
      bench/role: mockllm
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: __RELEASE__
        app.kubernetes.io/name: ai-gateway-bench
        bench/role: mockllm
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: __NODE_SELECTOR__
      tolerations: __TOLERATIONS__
      # Same zone as the database (and Redis), so no request crosses zones.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: __RELEASE__
                  bench/role: postgresql
      shareProcessNamespace: true
      containers:
        # For clusters without metrics-server: samples the pod's other processes itself (the process
        # namespace is shared) every 10 s and prints CPU and resident memory. run.sh reads the last
        # line with the pods/log API only when metrics.k8s.io cannot be read. Its own session (this
        # shell, awk, sleep) and the pause process are left out. $$$$ because Kubernetes turns $$ in
        # a command into $.
        - name: sampler
          image: __TOOLS_IMAGE__
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          command:
            - sh
            - -c
            - |
              hz="$(getconf CLK_TCK 2>/dev/null || echo 100)"
              pg="$(getconf PAGESIZE 2>/dev/null || echo 4096)"
              sid="$(cut -d')' -f2- /proc/$$$$/stat | awk '{print $4}')"
              prev="" pt=""
              while :; do
                t="$(date +%s)"
                set -- $(cat /proc/[0-9]*/stat 2>/dev/null | awk -v sid="$sid" '{
                  pid = $1; line = $0; sub(/^.*\) /, "", line); split(line, f, " ")
                  if (pid == 1 || f[4] == sid) next
                  ticks += f[12] + f[13]; rss += f[22]
                } END { printf "%d %d\n", ticks, rss }')
                if [ -n "$prev" ] && [ "$t" -gt "$pt" ]; then
                  d=$(($1 - prev)); [ "$d" -lt 0 ] && d=0
                  printf '{"t":%s,"cpu":"%sn","mem":"%sKi"}\n' "$t" "$((d * 1000000000 / hz / (t - pt)))" "$(($2 * pg / 1024))"
                fi
                prev="$1" pt="$t"
                sleep 10
              done
        - name: mockllm
          image: __TOOLS_IMAGE__
          # -count-headers is empty unless FEATURES=full, when verify reads the counts. With a Bifrost
          # side, -tls-addr :9443 (self-signed) for Bifrost's Bedrock provider, which only speaks HTTPS.
          command: ["sh", "-c", "exec mockllm -addr :9000 __MOCK_TLS_ARGS__ -count-headers '__MOCK_COUNT_HEADERS__'"]
          ports:
            - name: http
              containerPort: 9000
            - name: https
              containerPort: 9443
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: __RELEASE__-mockllm
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/instance: __RELEASE__
    app.kubernetes.io/name: ai-gateway-bench
    bench/part: setup
spec:
  selector:
    app.kubernetes.io/instance: __RELEASE__
    bench/role: mockllm
  ports:
    - name: http
      port: 9000
      targetPort: 9000
    - name: https
      port: 9443
      targetPort: 9443
---
# The gateways' s3_v2 request logs with features full (path-style, no credentials checked). Long
# strings are cut to 256 bytes as each log is stored, so hours of 1M-token prompts fit in memory
# while every field verify reads survives. Kits with the compressed store hold the ~3M logs of the
# sustained workloads (1,000 rps for 15 minutes, three sides) in a few GiB; its CPU keeps up so the
# gateways' log uploads never queue behind it.
