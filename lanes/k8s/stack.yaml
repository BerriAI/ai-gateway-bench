apiVersion: apps/v1
kind: Deployment
metadata:
  name: __RELEASE__-python
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/instance: __RELEASE__
    app.kubernetes.io/name: ai-gateway-bench
    bench/part: gateways
    bench/side: python
spec:
  replicas: __GATEWAY_REPLICAS__
  selector:
    matchLabels:
      app.kubernetes.io/instance: __RELEASE__
      bench/side: python
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: __RELEASE__
        app.kubernetes.io/name: ai-gateway-bench
        bench/side: python
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      # The image's USER is the name nonroot, which runAsNonRoot cannot verify; 65532 is its uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: __NODE_SELECTOR__
      tolerations: __TOLERATIONS__
      # Same zone as the mock. With shared state on the replicas do not fit beside the mock, so
      # both sides are kept off its node and pay the same one hop to it; off, the role matches
      # nothing and both sides share the mock's node as before.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: __RELEASE__
                  bench/role: mockllm
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: __RELEASE__
                  bench/role: __MOCK_APART_ROLE__
      initContainers:
        - name: genconfig
          image: __TOOLS_IMAGE__
          command:
            - sh
            - -c
            - |
              set -eu
              sh /genconfig/genconfig.sh /config
              if [ "__DISABLE_SPEND_LOGS__" = true ]; then
                sed -i '/^general_settings:$/a\  disable_spend_logs: true' /config/config.yaml
              fi
              # The Python router shares cooldowns only through router_settings; the Rust gateway
              # reads the REDIS_* variables below for the same thing.
              if [ "__SHARED_STATE__" = true ]; then
                printf '  redis_host: os.environ/REDIS_HOST\n  redis_port: 6379\n  redis_password: os.environ/REDIS_PASSWORD\n' > /config/router-redis.yaml
                sed -i '/^router_settings:$/r /config/router-redis.yaml' /config/config.yaml
                rm /config/router-redis.yaml
              fi
          volumeMounts:
            - name: genconfig
              mountPath: /genconfig
            - name: config
              mountPath: /config
      shareProcessNamespace: true
      containers:
        # For clusters without metrics-server: samples the pod's other processes itself (the process
        # namespace is shared) every 10 s and prints CPU and resident memory. run.sh reads the last
        # line with the pods/log API only when metrics.k8s.io cannot be read. Its own session (this
        # shell, awk, sleep) and the pause process are left out. $$$$ because Kubernetes turns $$ in
        # a command into $.
        - name: sampler
          image: __TOOLS_IMAGE__
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          command:
            - sh
            - -c
            - |
              hz="$(getconf CLK_TCK 2>/dev/null || echo 100)"
              pg="$(getconf PAGESIZE 2>/dev/null || echo 4096)"
              sid="$(cut -d')' -f2- /proc/$$$$/stat | awk '{print $4}')"
              prev="" pt=""
              while :; do
                t="$(date +%s)"
                set -- $(cat /proc/[0-9]*/stat 2>/dev/null | awk -v sid="$sid" '{
                  pid = $1; line = $0; sub(/^.*\) /, "", line); split(line, f, " ")
                  if (pid == 1 || f[4] == sid) next
                  ticks += f[12] + f[13]; rss += f[22]
                } END { printf "%d %d\n", ticks, rss }')
                if [ -n "$prev" ] && [ "$t" -gt "$pt" ]; then
                  d=$(($1 - prev)); [ "$d" -lt 0 ] && d=0
                  printf '{"t":%s,"cpu":"%sn","mem":"%sKi"}\n' "$t" "$((d * 1000000000 / hz / (t - pt)))" "$(($2 * pg / 1024))"
                fi
                prev="$1" pt="$t"
                sleep 10
              done
        - name: gateway
          image: __PYTHON_IMAGE__
          args: ["--host", "0.0.0.0", "--port", "4000"]
          env:
            - name: NUM_WORKERS
              value: "__PYTHON_WORKERS__"
            # One registry across the workers, so /metrics counts every request, not one
            # worker's share.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /prometheus
            # features full: the s3_v2 callback's settings (config.yaml reads LOADTEST_S3_*), each
            # side under its own prefix; unused otherwise. Same batch interval on both sides.
            - name: LOADTEST_S3_BUCKET
              value: logs
            - name: LOADTEST_S3_ENDPOINT
              value: http://__RELEASE__-s3stub.__NAMESPACE__.svc.cluster.local:9100
            - name: LOADTEST_S3_PATH
              value: python
            - name: LOADTEST_S3_ACCESS_KEY_ID
              value: bench-not-a-secret
            - name: LOADTEST_S3_SECRET_ACCESS_KEY
              value: bench-not-a-secret
            - name: DEFAULT_S3_FLUSH_INTERVAL_SECONDS
              value: "10"
            - name: CONFIG_FILE_PATH
              value: /config/config.yaml
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: __RELEASE__-credentials
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __RELEASE__-credentials
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@__RELEASE__-postgresql.__NAMESPACE__.svc.cluster.local:5432/litellm
            # Shared state: with SHARED_STATE=on these are REDIS_HOST, REDIS_PORT and
            # REDIS_PASSWORD, which both gateways read for cross-replica coordination (cooldowns,
            # key invalidation, budget and rate-limit counters). Off, they get names nothing reads.
            - name: __REDIS_ENV_PREFIX__REDIS_HOST
              value: __RELEASE__-redis.__NAMESPACE__.svc.cluster.local
            - name: __REDIS_ENV_PREFIX__REDIS_PORT
              value: "6379"
            - name: __REDIS_ENV_PREFIX__REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __RELEASE__-credentials
                  key: redis-password
          envFrom:
            # An optional litellm-license Secret (LITELLM_LICENSE), if the namespace has one.
            - secretRef:
                name: litellm-license
                optional: true
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: prometheus
              mountPath: /prometheus
          resources:
            requests:
              cpu: "__GATEWAY_CPU__"
              memory: __GATEWAY_MEMORY__
            limits:
              cpu: "__GATEWAY_CPU__"
              memory: __GATEWAY_MEMORY__
      volumes:
        - name: genconfig
          configMap:
            name: __RELEASE__-genconfig
        - name: config
          emptyDir: {}
        - name: prometheus
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: __RELEASE__-python
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/instance: __RELEASE__
    app.kubernetes.io/name: ai-gateway-bench
    bench/part: gateways
    bench/side: python
spec:
  selector:
    app.kubernetes.io/instance: __RELEASE__
    bench/side: python
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
# One DNS record per replica, so verify scrapes /metrics on each.
apiVersion: v1
kind: Service
metadata:
  name: __RELEASE__-python-pods
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/instance: __RELEASE__
    app.kubernetes.io/name: ai-gateway-bench
    bench/part: gateways
    bench/side: python
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: __RELEASE__
    bench/side: python
  ports:
    - name: http
      port: 4000
      targetPort: 4000
