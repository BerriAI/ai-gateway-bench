kind: Deployment
metadata:
  name: __RELEASE__-s3stub
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/instance: __RELEASE__
    app.kubernetes.io/name: ai-gateway-bench
    bench/part: setup
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: __RELEASE__
      bench/role: s3stub
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: __RELEASE__
        app.kubernetes.io/name: ai-gateway-bench
        bench/role: s3stub
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector: __NODE_SELECTOR__
      tolerations: __TOLERATIONS__
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: __RELEASE__
                  bench/role: postgresql
      shareProcessNamespace: true
      containers:
        # For clusters without metrics-server: samples the pod's other processes itself (the process
        # namespace is shared) every 10 s and prints CPU and resident memory. run.sh reads the last
        # line with the pods/log API only when metrics.k8s.io cannot be read. Its own session (this
        # shell, awk, sleep) and the pause process are left out. $$$$ because Kubernetes turns $$ in
        # a command into $.
        - name: sampler
          image: __TOOLS_IMAGE__
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          command:
            - sh
            - -c
            - |
              hz="$(getconf CLK_TCK 2>/dev/null || echo 100)"
              pg="$(getconf PAGESIZE 2>/dev/null || echo 4096)"
              sid="$(cut -d')' -f2- /proc/$$$$/stat | awk '{print $4}')"
              prev="" pt=""
              while :; do
                t="$(date +%s)"
                set -- $(cat /proc/[0-9]*/stat 2>/dev/null | awk -v sid="$sid" '{
                  pid = $1; line = $0; sub(/^.*\) /, "", line); split(line, f, " ")
                  if (pid == 1 || f[4] == sid) next
                  ticks += f[12] + f[13]; rss += f[22]
                } END { printf "%d %d\n", ticks, rss }')
                if [ -n "$prev" ] && [ "$t" -gt "$pt" ]; then
                  d=$(($1 - prev)); [ "$d" -lt 0 ] && d=0
                  printf '{"t":%s,"cpu":"%sn","mem":"%sKi"}\n' "$t" "$((d * 1000000000 / hz / (t - pt)))" "$(($2 * pg / 1024))"
                fi
                prev="$1" pt="$t"
                sleep 10
              done
        - name: s3stub
          image: __TOOLS_IMAGE__
          command: ["s3stub", "-addr", ":9100", "-max-string", "256"]
          ports:
            - name: http
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /health
              port: 9100
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              memory: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: __RELEASE__-s3stub
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/instance: __RELEASE__
    app.kubernetes.io/name: ai-gateway-bench
    bench/part: setup
spec:
  selector:
    app.kubernetes.io/instance: __RELEASE__
    bench/role: s3stub
  ports:
